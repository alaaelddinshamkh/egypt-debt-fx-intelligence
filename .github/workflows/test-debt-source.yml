
name: Test FoudaLens Historical API

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/test_historical_api.py"
      - ".github/workflows/test-debt-source.yml"

permissions:
  contents: read

jobs:
  test-historical-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test historical API
        run: python scripts/test_historical_api.py
