name: Test Debt Data Source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test debt news source
        run: python scripts/test_debt_source.py
