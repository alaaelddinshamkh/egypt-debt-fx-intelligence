name: Egypt Debt FX - Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openpyxl

      - name: Check required files
        run: |
          test -f index.html
          test -f data/fx_history.json
          test -f scripts/update_fx.py
          test -f 'historical data(2).xlsx'
          echo "All required files found."

      - name: Test FX data updater
        run: |
          python scripts/update_fx.py \
            --excel 'historical data(2).xlsx'

      - name: Validate JSON
        run: |
          python -m json.tool data/fx_history.json > /dev/null

      - name: Verify historical data unchanged
        run: |
          git diff --exit-code -- data/fx_history.json
