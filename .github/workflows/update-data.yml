name: Egypt Debt FX - Live USD Update

on:
  workflow_dispatch:

  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: egypt-fx-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:

      # STEP 1 - Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # STEP 2 - Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # STEP 3 - Check required files
      - name: Check required files
        run: |
          test -f index.html
          test -f data/fx_history.json
          test -f scripts/update_live_fx.py

          echo "All required files found."

      # STEP 4 - Download latest USD/EGP rate
      - name: Fetch live USD EGP rate
        run: |
          python scripts/update_live_fx.py --apply

      # STEP 5 - Validate live JSON
      - name: Validate live FX JSON
        run: |
          python -m json.tool data/fx_live.json > /dev/null

          echo "Live FX JSON validated."

      # STEP 6 - Verify historical CBE data unchanged
      - name: Verify historical data unchanged
        run: |
          git diff --exit-code -- data/fx_history.json

          echo "Historical CBE data preserved."

      # STEP 7 - Commit updated live exchange rate
      - name: Commit and push live FX data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fx_live.json

          if git diff --cached --quiet; then
            echo "No new exchange rate to commit."
          else
            git commit -m "Auto-update USD EGP exchange rate"
            git push
          fi

      # STEP 8 - Finish
      - name: Update completed
        run: |
          echo "================================="
          echo "EGYPT DEBT FX INTELLIGENCE"
          echo "================================="
          echo "Live USD/EGP update completed."
          echo "Historical CBE data preserved."
          echo "Workflow completed successfully."
