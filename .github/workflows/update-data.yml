name: Egypt Debt FX - Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check dashboard files
        run: |
          test -f index.html
          test -f data/fx_history.json
          echo "Dashboard files found."

      - name: Update FX data
        run: |
          if [ -f scripts/update_fx.py ]; then
            python scripts/update_fx.py
          else
            echo "FX updater not installed yet."
            echo "Existing historical data will remain unchanged."
          fi

      - name: Validate JSON
        run: |
          python -m json.tool data/fx_history.json > /dev/null

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/fx_history.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Automated FX data update"
            git push
          fi
